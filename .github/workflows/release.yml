name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Without an NPM_TOKEN secret the release still goes to GitHub, only the npm publish is skipped.
      # setup-node fills NODE_AUTH_TOKEN with a placeholder, so the check reads the secret itself.
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux
      - run: npm ci
      - name: tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm test
        env:
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@example.com
          GIT_COMMITTER_NAME: ci
          GIT_COMMITTER_EMAIL: ci@example.com
      - name: pack
        run: mv "$(npm pack --silent)" claudegrid.tgz
      - name: deb package
        run: bash packaging/deb/build.sh claudegrid.tgz "${GITHUB_REF_NAME#v}" .
      - name: release notes from CHANGELOG.md
        run: awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## \\[?"v"\\]?" {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" claudegrid.tgz claudegrid.deb --title "$GITHUB_REF_NAME" --notes-file notes.md
      - name: npm publish
        if: env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish claudegrid.tgz --provenance --access public
