name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux zsh fish shellcheck
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@example.com
          GIT_COMMITTER_NAME: ci
          GIT_COMMITTER_EMAIL: ci@example.com

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: brew install tmux
      - run: npm ci
      - run: npm test
      - name: install.sh with the bash that ships with macOS
        run: /bin/bash ./install.sh && claudegrid --version && claudegrid doctor || true
      - name: iTerm2 dry run
        run: node dist/cli.js -b iterm2 -l 3x2 -p "hello" --dry-run

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh fish shellcheck
      - run: npm ci
      - name: shellcheck install.sh
        run: shellcheck install.sh
      - name: completion scripts parse
        run: |
          node dist/cli.js completion bash | bash -n
          node dist/cli.js completion zsh | zsh -n
          node dist/cli.js completion fish | fish --no-execute
      - name: package contents
        run: npm pack --dry-run 2>&1 | tee pack.txt && grep -q dist/cli.js pack.txt && ! grep -q 'src/' pack.txt
